experiment_name: rq1_baseline_test
mode: always_retrieve
retriever:
  type: vector_db
  db_path: ./data/chroma_db
  collection_name: scifact_corpus
  embedding_model: Qwen/Qwen3-Embedding-0.6B
  top_k: 3
llm:
  provider: local_huggingface
  model_name: Qwen/Qwen2.5-1.5B-Instruct
  device: cuda
  max_new_tokens: 512
  temperature: 0.1
  do_sample: false
aggregator:
  max_context_tokens: 2000
data:
  root_path: ./data
  dataset_name: scifact
  split: dev
