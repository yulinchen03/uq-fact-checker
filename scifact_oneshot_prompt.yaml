  1. Choose "SUPPORT" ONLY IF the evidence explicitly contains scientific findings or data that confirm the claim.
  2. Choose "CONTRADICT" ONLY IF the evidence explicitly contains findings or data that prove the claim is scientifically incorrect (e.g., shows the opposite effect or different numbers).
  3. Choose "NOT ENOUGH INFO" IF the evidence is unrelated, tangential, or insufficient to make a definitive scientific conclusion. DO NOT GUESS.
  4. Keep your explanation concise and directly tied to the evidence, referencing specific facts or data points from the evidence that support your verdict. Keep it short!
  5. CRITICAL: Do not output any internal thinking, reasoning, or <think> tags inside or outside the JSON. Output ONLY the strict JSON object.
  
