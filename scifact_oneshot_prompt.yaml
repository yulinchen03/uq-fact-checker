  3. Choose "NOT ENOUGH INFO" IF the claim is too specific (e.g., referencing a highly specific obscure paper, strict epidemiological statistics) and you lack absolute certainty. DO NOT GUESS.
  4. Keep your explanation concise and directly tied to the claim, referencing specific facts or widely accepted knowledge that supports your verdict. Keep it short!
  5. CRITICAL: Do not output any internal thinking, reasoning, or <think> tags inside or outside the JSON. Output ONLY the strict JSON object.

