  Claim: "In double-stranded DNA, adenine pairs exclusively with guanine."
  Response:
  {{
    "verdict": "CONTRADICT",
    "explanation": "The evidence explicitly refutes the claim by stating that adenine (A) always pairs with thymine (T), not guanine."
  }}

