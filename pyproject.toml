[project]
name = "thesis-project"
version = "0.1.0"
requires-python = ">=3.10, <3.13"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "transformers==4.49",
    "scikit-learn",
    "sentence-transformers",
    "langchain>=1.0.5",
    "lm-polygraph>=0.4.0",
    "torch>=2.6.0",
    "langchain_text_splitters",
    "inquirer>=3.4.1",
    "langchain-huggingface>=1.1.0",
    "huggingface-hub>=0.36.0",
    "chromadb>=1.3.5",
    "pypdf>=6.4.0",
    "langchain-community>=0.4.1",
    "langchain-experimental>=0.4.0",
    "langchain-chroma>=1.0.0",
    "accelerate>=1.12.0",
    "cdlib>=0.4.0",
]

[tool.uv]
index-strategy = "unsafe-best-match"

[tool.uv.sources]
torch = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
