[project]
name = "thesis-project"
version = "0.1.0"
requires-python = ">=3.10, <3.13"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "scikit-learn",
    "sentence-transformers",
    "lm-polygraph>=0.5.0",
    "torch>=2.4.0",
    "langchain-text-splitters",
    "inquirer>=3.4.1",
    "langchain-huggingface>=1.1.0",
    "huggingface-hub>=0.36.0",
    "chromadb>=1.3.5",
    "accelerate>=1.12.0",
    "cdlib>=0.4.0",
    "openai>=2.14.0",
    "vllm>=0.6.0",
    "minicheck[llm]",
    "ipykernel>=7.1.0",
    "datasets>=4.4.2",
    "ijson>=3.4.0.post0",
    "transformers>=4.46.0",
]

[tool.uv]
index-strategy = "unsafe-best-match"

[tool.uv.sources]
torch = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu130"