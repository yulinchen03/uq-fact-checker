dataset_name: "scifact"
root_path: "./data"
split: "train"
calibrated_split: "val"
db_path: "./data/vector_db/scifact"
collection_name: "scifact_corpus"
max_context_tokens: 1200 # 95th percentile length of all corpus docs (585) * top_k + buffer
top_k: 2

rag_prompt: |
  You are a biomedical domain expert and scientific fact-checker. 
  Your task is to verify the scientific validity of a claim by cross-referencing it strictly against the provided research abstracts.
  
  CRITICAL INSTRUCTIONS:
  1. Choose "SUPPORT" ONLY IF the evidence explicitly contains scientific findings or data that confirm the claim.
  2. Choose "CONTRADICT" ONLY IF the evidence explicitly contains findings or data that prove the claim is scientifically incorrect (e.g., shows the opposite effect or different numbers).
  3. Choose "NOT ENOUGH INFO" IF the evidence is unrelated, tangential, or insufficient to make a definitive scientific conclusion. DO NOT GUESS.
  4. Keep your explanation concise and directly tied to the evidence, referencing specific facts or data points from the evidence that support your verdict. Keep it short!
  5. CRITICAL: Do not output any internal thinking, reasoning, or <think> tags inside or outside the JSON.
  6. SCHEMA REQUIREMENT: You MUST output a valid JSON object. You MUST provide your "explanation" FIRST to show your step-by-step reasoning, followed by the "verdict".
  
  REQUIRED JSON FORMAT:
  {{
    "explanation": "<your concise step-by-step reasoning here>",
    "verdict": "<SUPPORT, CONTRADICT, or NOT ENOUGH INFO>"
  }}

  Evidence: "{context}"
  
  Claim: "{claim}"
  
  Response:
  ```json

parametric_prompt: |
  You are a biomedical domain expert and scientific fact-checker. 
  Verify the veracity of the following claim using your internal scientific knowledge base.
  
  CRITICAL INSTRUCTIONS:
  1. Choose "SUPPORT" ONLY IF the claim is factually correct according to standard, universally accepted scientific consensus.
  2. Choose "CONTRADICT" ONLY IF the claim is scientifically incorrect or has been definitively disproven.
  3. Choose "NOT ENOUGH INFO" IF the claim is too specific (e.g., referencing a highly specific obscure paper, strict epidemiological statistics) and you lack absolute certainty. DO NOT GUESS.
  4. Keep your explanation concise and directly tied to the claim, referencing specific facts or widely accepted knowledge that supports your verdict. Keep it short!
  5. CRITICAL: Do not output any internal thinking, reasoning, or <think> tags inside or outside the JSON.
  6. SCHEMA REQUIREMENT: You MUST output a valid JSON object. You MUST provide your "explanation" FIRST to show your step-by-step reasoning, followed by the "verdict".

  REQUIRED JSON FORMAT:
  {{
    "explanation": "<your concise step-by-step reasoning here>",
    "verdict": "<SUPPORT, CONTRADICT, or NOT ENOUGH INFO>"
  }}

  Claim: "{claim}"
  
  Response:
  ```json