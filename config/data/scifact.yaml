dataset_name: "scifact"
root_path: "./data"
split: "train"
calibrated_split: "val"
db_path: "./data/vector_db/scifact"
collection_name: "scifact_corpus"
max_context_tokens: 600 # 95th percentile length of all corpus docs (585) * top_k + buffer
top_k: 1

rag_prompt: |
  You are a biomedical domain expert and scientific fact-checker. 
  Your task is to verify the scientific validity of a claim by cross-referencing it strictly against the provided research abstracts.
  
  CRITICAL INSTRUCTIONS:
  1. Choose "SUPPORT" ONLY IF the evidence explicitly contains scientific findings or data that confirm the claim.
  2. Choose "CONTRADICT" ONLY IF the evidence explicitly contains findings or data that prove the claim is scientifically incorrect.
  3. Choose "NOT ENOUGH INFO" IF the evidence is unrelated, tangential, or insufficient to make a definitive scientific conclusion. DO NOT GUESS.
  4. Explanation: Limit to MAX 2 sentences. State only the relevant scientific fact or data point from the evidence that led to your verdict.
  5. Format: Return a valid JSON object. Provide "explanation" then "verdict".
  6. Constraint: Do not repeat the claim text. Do not provide background history or filler phrases.
  7. No <think> tags or internal reasoning.

  REQUIRED FORMAT:
  {{
    "explanation": "<max 2 sentences>",
    "verdict": "<SUPPORT, CONTRADICT, or NOT ENOUGH INFO>"
  }}

  Evidence: "{context}"
  Claim: "{claim}"
  Response:
  ```json

parametric_prompt: |
  You are a biomedical domain expert and scientific fact-checker. 
  Verify the veracity of the following claim using your internal scientific knowledge base.
  
  CRITICAL INSTRUCTIONS:
  1. Choose "SUPPORT" ONLY IF the claim is factually correct according to standard, universally accepted scientific consensus.
  2. Choose "CONTRADICT" ONLY IF the claim is scientifically incorrect or has been definitively disproven.
  3. Choose "NOT ENOUGH INFO" IF the claim is too specific (e.g., referencing a highly specific obscure paper) and you lack absolute certainty. DO NOT GUESS.
  4. Explanation: Limit to MAX 2 sentences. State only the relevant fact that led to your verdict.
  5. Format: Return a valid JSON object. Provide "explanation" then "verdict".
  6. Constraint: Do not repeat the claim. Do not provide background history.
  7. No <think> tags or internal reasoning.

  REQUIRED FORMAT:
  {{
    "explanation": "<max 2 sentences>",
    "verdict": "<SUPPORT, CONTRADICT, or NOT ENOUGH INFO>"
  }}

  Claim: "{claim}"
  Response:
  ```json