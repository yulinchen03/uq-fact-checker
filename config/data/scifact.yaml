dataset_name: "scifact"
root_path: "./data"
split: "train"
calibrated_split: "val"
top_k: 1


rag_short: |
  You are a biomedical domain expert and scientific fact-checker. 
  Verify the veracity of the following claim by cross-referencing it strictly against the provided evidence.
  
  CRITICAL INSTRUCTIONS:
  1. Choose "SUPPORT" ONLY IF the evidence explicitly contains scientific findings or data that confirm the claim.
  2. Choose "CONTRADICT" ONLY IF the evidence explicitly contains findings or data that prove the claim is scientifically incorrect.
  3. Choose "NOT ENOUGH INFO" IF the evidence is unrelated, tangential, or insufficient to make a scientific conclusion. Base your decision entirely on the provided text.
  4. Format: Output EXACTLY ONE LABEL. Do not output JSON. Do not output an explanation. Do not use punctuation.

  Evidence: "{context}"
  Claim: "{claim}"
  Response:


rag_long: |
  You are a biomedical domain expert and scientific fact-checker. 
  Verify the veracity of the following claim by cross-referencing it strictly against the provided evidence.
  
  CRITICAL INSTRUCTIONS:
  1. Choose "SUPPORT" ONLY IF the evidence explicitly contains scientific findings or data that confirm the claim.
  2. Choose "CONTRADICT" ONLY IF the evidence explicitly contains findings or data that prove the claim is scientifically incorrect.
  3. Choose "NOT ENOUGH INFO" IF the evidence is unrelated, tangential, or insufficient to make a scientific conclusion. Base your decision entirely on the provided text.
  4. Explanation: Limit to MAX 2 sentences. State only the relevant scientific fact or data point from the evidence that led to your verdict.
  5. Format: Return a valid JSON object. Provide "explanation" then "verdict".
  6. Constraint: Do not repeat the claim text. Do not provide background history or filler phrases.
  7. No think tags or internal reasoning.

  REQUIRED FORMAT:
  {{
    "explanation": "<max 2 sentences>",
    "verdict": "<SUPPORT, CONTRADICT, or NOT ENOUGH INFO>"
  }}

  Evidence: "{context}"
  Claim: "{claim}"
  Response:
  ```json


parametric_short: |
    You are a biomedical domain expert and scientific fact-checker. 
    Verify the veracity of the following claim using your internal scientific knowledge.
    
    CRITICAL INSTRUCTIONS:
    1. Evaluate the claim based on the most likely scientific consensus, making your best assessment even if you are not 100% certain.
    2. Choose "SUPPORT" if the scientific evidence generally leans towards the claim being true.
    3. Choose "CONTRADICT" if the scientific evidence generally leans towards the claim being false.
    4. Choose "NOT ENOUGH INFO" ONLY IF the claim is fundamentally subjective, unscientific, or impossible to test. Do not use this label simply because you are unsure of the answer.

    Claim: "{claim}"
    Response:


