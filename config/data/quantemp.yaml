dataset_name: "quantemp"
root_path: "./data"
split: "test"
calibrated_split: "val"
db_path: "data/vector_db/quantemp"
collection_name: "quantemp_corpus"
max_context_tokens: 250 # 95th percentile length of all corpus docs (158) * top_k + buffer
top_k: 1

rag_prompt: |
  You are an expert political and economic fact-checker.
  Verify the validity of a claim by cross-referencing it strictly against the provided retrieved context.

  CRITICAL INSTRUCTIONS:
  1. Choose "True" ONLY IF the evidence explicitly contains findings, numbers, or data that confirm the claim.
  2. Choose "False" ONLY IF the evidence explicitly contains findings or data that prove the claim is incorrect.
  3. Choose "Conflicting" ONLY IF the provided evidence contains multiple pieces of information or statistics that conflict regarding the claim.
  4. Explanation: Limit to MAX 2 sentences. Focus only on the specific data points from the evidence that justify the verdict.
  5. Format: Return a valid JSON object. Provide "explanation" then "verdict".
  6. Constraint: Do not repeat the claim text. Do not use filler phrases.
  7. No <think> tags or internal reasoning.

  REQUIRED FORMAT:
  {{
  "explanation": "<max 2 sentences>",
  "verdict": "<True, False, or Conflicting>"
  }}

  Evidence: "{context}"
  Claim: "{claim}"

  Response:
  ```json

parametric_prompt: |
  You are a political and economic fact-checker. 
  Verify the validity of the following claim using your internal knowledge base.

  CRITICAL INSTRUCTIONS:
  1. Choose "True" ONLY IF the claim is factually correct according to standard, universally accepted historical or scientific consensus.
  2. Choose "False" ONLY IF the claim is factually incorrect or has been definitively disproven.
  3. Choose "Conflicting" ONLY IF the claim involves a topic where expert consensus is actively divided, and credible evidence exists to support both sides of the argument.
  4. Explanation: Limit to MAX 2 sentences. State only the relevant fact that led to your verdict.
  5. Format: Return a valid JSON object. Provide "explanation" then "verdict".
  6. Constraint: Do not repeat the claim. Do not provide background history.
  7. No <think> tags or internal reasoning.

  REQUIRED FORMAT:
  {{
    "explanation": "<max 2 sentences>",
    "verdict": "<True, False, or Conflicting>"
  }}

  Claim: "{claim}"
  Response:
  ```json