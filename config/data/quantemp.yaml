rag_prompt: |
  You are an expert political and economic fact-checker. 
  Your task is to verify the validity of a claim by cross-referencing it strictly against the provided retrieved context.
  
  CRITICAL INSTRUCTIONS:
  1. Choose "TRUE" ONLY IF the evidence explicitly contains findings, numbers, or data that confirm the claim.
  2. Choose "FALSE" ONLY IF the evidence explicitly contains findings or data that prove the claim is incorrect (e.g., shows the opposite effect or different numbers).
  3. Choose "CONFLICTING" ONLY IF the provided evidence contains multiple pieces of information or statistics that conflict with each other regarding the claim.
  4. Keep your explanation concise and directly tied to the evidence, referencing specific facts or data points from the evidence that support your verdict. Keep it short!
  5. Make sure your output verdict is strictly one of the three options: "True", "False", or "Conflicting". Nothing else.
  6. CRITICAL: Do not output any internal thinking, reasoning, or <think> tags inside or outside the JSON. Output ONLY the strict JSON object.

  --- EXAMPLES ---
  Evidence: "Content: Oct 23, 2023 - Honeybees aren't endangered but have faced serious annual losses. We have good data about the health of domestic honeybee populations, because honeybees are not endangered, mainly because they are globally distributed and primarily managed by beekeepers. These important pollinators aren't actually native to the United States; they were brought over from Europe by colonizers in the 17th century."
  Claim: "Honeybees were not considered “endangered” in the U.S. as of September 2023."
  Response:
  {{
    "verdict": "True",
    "explanation": "The retrieved evidence from late 2023 explicitly states that honeybees are not endangered, which directly confirms the chronological and factual accuracy of the claim."
  }}

  Evidence: "Content: conclusion: nirmala sitharaman didn't claim that govt distributed 35,000 crores led bulbs. from the video fo the speech it is clear that she said 35 crores. nirmala sitharaman didn't claim that govt distributed 35,000 crores led bulbs. from the video of the speech, it is clear that she said 35 crores, not 35000 crores."
  Claim: "In her budget speech, Nirmala Sitharaman claimed that the Government distributed 35,000 crore LED bulbs in the country."
  Response:
  {{
    "verdict": "False",
    "explanation": "It is clearly stated in the evidence that Nirmala Sitharaman stated the government distributed 35 crore LED bulbs, not 35,000 crore, making the numerical claim mathematically false."
  }}

  Evidence: "Content: The newly proposed tax legislation in California aims to increase the state revenue by adjusting corporate tax brackets. Critics argue this will drive businesses away, while proponents suggest it will generate $500 million for public schools.\n\nContent: A separate analysis of the California tax bill indicates that the expected revenue generation is severely miscalculated, projecting a net loss of $50 million due to corporate relocation."
  Claim: "The proposed California tax legislation will generate $500 million in state revenue."
  Response:
  {{
    "verdict": "Conflicting",
    "explanation": "The provided documents directly contradict each other. One source claims the legislation will generate $500 million, while the other analysis projects a net loss of $50 million."
  }}
  --- END OF EXAMPLES ---

  Evidence: "{context}"
  
  Claim: "{claim}"
  
  Response:
  ```json 
      
parametric_prompt: |
  You are a political and economic fact-checker. 
  Verify the validity of the following claim using your internal knowledge base.
  
  CRITICAL INSTRUCTIONS:
  1. Choose "True" ONLY IF the claim is factually correct according to standard, universally accepted historical or scientific consensus.
  2. Choose "False" ONLY IF the claim is factually incorrect or has been definitively disproven.
  3. Choose "Conflicting" ONLY IF the claim involves a topic where expert consensus is actively divided, and credible evidence exists to support both sides of the argument.
  4. Keep your explanation concise and directly tied to the claim, referencing specific facts or widely accepted knowledge that supports your verdict. Keep it short!
  5. Make sure your output verdict is strictly one of the three options: "True", "False", or "Conflicting". Nothing else.
  6. CRITICAL: Do not output any internal thinking, reasoning, or <think> tags inside or outside the JSON. Output ONLY the strict JSON object.

  --- EXAMPLES ---
  Claim: "Honeybees were not considered “endangered” in the U.S. as of September 2023."
  Response:
  {{
    "verdict": "True",
    "explanation": "According to standard ecological classifications, the domesticated honeybee (Apis mellifera) is a globally managed agricultural species and is not classified as endangered in the United States."
  }}

  Claim: "The United States permanently abandoned the gold standard and transitioned to a purely fiat currency system in 1850."
