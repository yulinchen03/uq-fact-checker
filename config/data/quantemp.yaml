dataset_name: "quantemp"
root_path: "./data"
split: "test"
calibrated_split: "val"
top_k: 2

rag_short: |
  You are an expert political and economic fact-checker.
  Verify the veracity of the following claim by cross-referencing it strictly against the provided evidence.

  CRITICAL INSTRUCTIONS:
  1. Choose "True" if the evidence contains findings, numbers, or data that confirm the claim.
  2. Choose "False" if the evidence contains findings or data that prove the claim is incorrect.
  3. Choose "Conflicting" if the provided evidence contains multiple pieces of information or statistics that conflict with each other regarding the claim.

  Evidence: "{context}"
  Claim: "{claim}"
  Response:


rag_long: |
  You are an expert political and economic fact-checker.
  Verify the veracity of the following claim by cross-referencing it strictly against the provided evidence.

  CRITICAL INSTRUCTIONS:
  1. Choose "True" if the evidence contains findings, numbers, or data that confirm the claim.
  2. Choose "False" if the evidence contains findings or data that prove the claim is incorrect.
  3. Choose "Conflicting" if the provided evidence contains multiple pieces of information or statistics that conflict with each other regarding the claim.
  4. Base your decision entirely on the provided text.
  5. Explanation: Limit to MAX 2 sentences. Focus only on the specific data points from the evidence that justify the verdict.
  6. Format: Return a valid JSON object. Provide "explanation" then "verdict".
  7. Constraint: Do not repeat the claim text. Do not use filler phrases.
  8. No think tags or internal reasoning.

  REQUIRED FORMAT:
  {{
    "explanation": "<max 2 sentences>",
    "verdict": "<True, False, or Conflicting>"
  }}

  Evidence: "{context}"
  Claim: "{claim}"
  Response:
  ```json


parametric_short: |
    You are an expert political and economic fact-checker. 
    Verify the veracity of the following claim using your internal knowledge only.
    
    CRITICAL INSTRUCTIONS:
    1. Evaluate the claim based on the most likely historical or economic data, making your best assessment.
    2. Choose "True" if standard consensus leans towards the numbers or dates being correct.
    3. Choose "False" if the claim likely contains incorrect numbers, dates, or factual errors.
    4. Choose "Conflicting" ONLY IF you specifically know of credible, contradictory datasets or reports that make a single truth impossible. Do not use this label simply because you cannot remember the exact numbers.

    Claim: "{claim}"
    Response:


parametric_long: |
  You are an expert political and economic fact-checker. 
  Verify the veracity of the following claim using your internal knowledge only.

  CRITICAL INSTRUCTIONS:
  1. Evaluate the claim based on the most likely historical or economic data, making your best assessment.
  2. Choose "True" if standard consensus leans towards the numbers or dates being correct.
  3. Choose "False" if the claim likely contains incorrect numbers, dates, or factual errors.
  4. Choose "Conflicting" ONLY IF you specifically know of credible, contradictory datasets or reports that make a single truth impossible. Do not use this label simply because you cannot remember the exact numbers.
  5. Explanation: Limit to MAX 2 sentences. State only the relevant fact that led to your verdict.
  6. Format: Return a valid JSON object. Provide "explanation" then "verdict".
  7. Constraint: Do not repeat the claim. Do not provide background history.
  8. No think tags or internal reasoning.

  REQUIRED FORMAT:
  {{
    "explanation": "<max 2 sentences>",
    "verdict": "<True, False, or Conflicting>"
  }}

  Claim: "{claim}"
  Response:
  ```json