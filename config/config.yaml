defaults:
  - data: scifact
  - _self_

experiment_name: "rq1_baseline_test"
mode: "always_retrieve"

retriever:
  type: "vector_db"
  db_path: ${data.db_path}
  collection_name: ${data.collection_name}
  embedding_model: "Qwen/Qwen3-Embedding-0.6B"
  top_k: 3
  debug: false

llm:
  provider: "local_huggingface"
  model_name: "Qwen/Qwen2.5-1.5B-Instruct"
  device: "cuda"
  max_new_tokens: 512
  temperature: 0.1
  do_sample: false
  debug: true

aggregator:
  max_context_tokens: 8000

prompts:
  rag: ${data.rag_prompt}

  parametric: ${data.parametric_prompt}