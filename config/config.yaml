defaults:
  - _self_

experiment_name: "rq1_baseline_test"
mode: "always_retrieve"  # Options: "always_retrieve", "never_retrieve", "UQ-aware"

retriever:
  type: "vector_db"
  db_path: "./data/chroma_db"
  collection_name: "scifact_corpus"
  # User specified model
  embedding_model: "Qwen/Qwen3-Embedding-0.6B" 
  top_k: 3
  debug: false

llm:
  provider: "local_huggingface"
  model_name: "Qwen/Qwen2.5-1.5B-Instruct"  # The specific model requested
  device: "cuda"  # or "cpu", "mps"
  max_new_tokens: 512
  temperature: 0.1
  do_sample: false,  # Deterministic for reproducibility
  debug: true

aggregator:
  max_context_tokens: 8000

data:
  root_path: "./data"
  dataset_name: "scifact"    # or "quantemp"
  split: "test"               # "train", "dev", "test"

prompts:
  rag: |
    You are an expert fact-checker. 
    Verify the veracity of the following claim strictly based on the provided evidence.
    
    Evidence:
    {context}
    
    Claim: "{claim}"
    
    Provide a structured response in JSON format with two keys:
    1. "verdict": One of "SUPPORT", "CONTRADICT", or "NOT ENOUGH INFO".
    2. "explanation": A concise, one-sentence justification based strictly on the evidence.
    3. If you do not have enough knowledge/evidence to determine the verdict, choose "NOT ENOUGH INFO" as verdict.

  parametric: |
    You are an expert fact-checker. 
    Verify the veracity of the following claim using your internal knowledge only.
    
    Claim: "{claim}"
    
    Provide a structured response in JSON format with two keys:
    1. "verdict": One of "SUPPORT", "CONTRADICT", or "NOT ENOUGH INFO".
    2. "explanation": A concise, one-sentence justification for your verdict.
    3. If you do not have enough information to determine the verdict, choose "NOT ENOUGH INFO" as verdict.